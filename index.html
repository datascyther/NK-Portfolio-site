<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23050505'/><text x='50' y='68' font-size='52' font-family='Helvetica,Arial' font-weight='bold' fill='white' text-anchor='middle'>NK</text></svg>"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="NK — AI Product Engineer. Explore Jouspace and the product thinking, AI systems, and engineering behind my work."
    />
    <meta
      name="theme-color"
      content="#111210"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f7f6f2"
      media="(prefers-color-scheme: light)"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <title>NK — Selected Work</title>
    <script>
      (function () {
        try {
          var t =
            localStorage.getItem("nk-theme") ||
            (window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark");
          document.documentElement.classList.toggle("light", t === "light");
          // Keep theme-color in sync for browser chrome
          var meta = document.querySelector(
            'meta[name="theme-color"]:not([media])',
          );
          if (!meta) {
            meta = document.createElement("meta");
            meta.setAttribute("name", "theme-color");
            document.head.appendChild(meta);
          }
          meta.setAttribute("content", t === "light" ? "#f7f6f2" : "#111210");
        } catch (e) {}
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/PPNeueMontreal-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
