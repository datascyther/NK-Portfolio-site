      (function () {
        try {
          var t =
            localStorage.getItem("nk-theme") ||
            (window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark");
          document.documentElement.classList.toggle("light", t === "light");
        } catch (e) {}
      })();
    </script>
