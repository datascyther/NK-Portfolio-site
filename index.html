<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-nk.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-nk.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="NK — AI Product Engineer. Explore Jouspace and the product thinking, AI systems, and engineering behind my work."
    />
    <meta
      name="theme-color"
      content="#15171c"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f7f8fb"
      media="(prefers-color-scheme: light)"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <title>NK</title>
    <script>
      (function () {
        try {
          var t =
            localStorage.getItem("nk-theme") ||
            (window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark");
          document.documentElement.classList.toggle("light", t === "light");
          // Keep theme-color in sync for browser chrome
          var meta = document.querySelector(
            'meta[name="theme-color"]:not([media])',
          );
          if (!meta) {
            meta = document.createElement("meta");
            meta.setAttribute("name", "theme-color");
            document.head.appendChild(meta);
          }
          meta.setAttribute("content", t === "light" ? "#f7f8fb" : "#15171c");
        } catch (e) {}
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/PPNeueMontreal-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
